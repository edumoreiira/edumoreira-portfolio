@let item = project();
<div class="flex flex-col bg-neutral-950 border border-neutral-800 rounded-xl p-6">
  <div class="flex items-start gap-3">
    <img class="invert size-9"
    src="/icons/github.png" alt="Github Icon">
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-2">
        <h1 class="font-semibold line-clamp-1">{{ item.title }}</h1>
        <a class="text-neutral-500 hover:text-neutral-300 transition-colors"
        href="{{ item.repository_url }}" target="_blank" rel="noopener noreferrer">
          <i class="fi fi-rr-link flex text-xs"></i>
        </a>
      </div>
      <div [ngClass]="item.commit_count >= 15 ? 'text-[hsl(48,15%,56%)]' : 'text-neutral-500'"
      class="flex items-center gap-1 text-xs">
        <i class="fi fi-rr-code-compare flex"></i>
        <span>{{ item.commit_count }}</span>
      </div>
    </div>
  </div>

  <p class="text-sm text-neutral-400 mt-4">{{ item.description }}</p>
</div>
