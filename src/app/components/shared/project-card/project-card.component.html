@let item = project();
<div class="flex items-start gap-4 justify-between">
  <div class="flex items-start gap-3">
    <img class="invert size-9"
    src="/icons/github.png" alt="Github Icon">
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-2">
        <h1 class="font-semibold line-clamp-1">{{ item.title }}</h1>
        <!-- <a href="{{ item.site_url }}" target="_blank" rel="noopener noreferrer">
          <i class="fi fi-rr-link flex text-xs text-neutral-500"></i>
        </a> -->
      </div>
      <div class="flex items-center gap-1 text-xs text-neutral-500">
        <i class="fi fi-rr-code-compare flex"></i>
        <span>{{ item.commit_count }}</span>
      </div>
    </div>
  </div>
  <span class="text-sm text-neutral-500 shrink-0">{{ item.created_at | date: 'dd MMM. yyyy' }}</span>
</div>
<p class="text-sm text-neutral-400 line-clamp-3">{{ item.description }}</p>
<div class="flex justify-between gap-2 mt-auto text-sm">
  <button class="px-3 py-1 !rounded-lg" custom-btn variant="outline">Detalhes técnicos</button>
  <button class="gap-2 px-3 py-1 !rounded-lg flex items-center !shadow-white/15" custom-btn variant="contained">
    <i class="fi fi-br-expand flex"></i>
    <span>Preview</span>
  </button>
</div>
