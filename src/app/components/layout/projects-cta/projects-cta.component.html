<div class="py-20"
app-glowing-border glowColor="hsla(0, 0%, 25%, 0.1)" borderColor="var(--color-neutral-900)" glowSize="500px">
  <div app-glowing-border-item borderColor="var(--color-neutral-800)"
  class="m-px overflow-hidden rounded-2xl">
    <div 
    class="grid grid-cols-[1fr] sm:grid-cols-[1fr_4fr] grid-rows-[200px] sm:grid-rows-[270px] md:grid-rows-[300px] rounded-2xl overflow-hidden m-px relative">
      <div class="flex flex-col justify-center sm:items-start items-center sm:ml-8 z-20">
        <h1 class="text-4xl sm:text-[2.4rem] md:text-5xl font-semibold text-nowrap">Meus Projetos</h1>
        <a [routerLink]="['../../projects']"
        class="text-lg sm:text-base md:text-lg text-neutral-500 flex items-center gap-1 group
        hover:text-neutral-200 transition-colors whitespace-nowrap
        md:py-4 py-2">
          Confira todos os meus projetos
          <i class="fi fi-rr-angle-small-right flex
          group-hover:ml-1 transition-all"></i>
        </a>
  
      </div>
      
      <div class="transform-3d m-px rounded-2xl sm:relative absolute inset-[0] overflow-hidden sm:overflow-visible
       sm:opacity-100 opacity-30">
       <div class="sm:hidden absolute inset-0 z-10 backdrop-blur-xs bg-neutral-950/50"></div>
        <div class="absolute top-[-170px] min-w-full w-fit-conent sm:left-[5%] xs:-left-1/3 -left-[75%]
        h-[720px] grid grid-cols-[repeat(3,350px)] gap-6
        -rotate-14 -rotate-x-50 rotate-z-40">
          <app-infinite-scrolling
           direction="vertical" [speed]="42" [gap]="-40" [fadeCorner]="false" [pauseOnHover]="false">
            @for (item of projectColumns()[0].column; track item.id) {
              <article class="w-[350px] h-[200px]" 
              #item app-project-card app-glowing-border-item 
              [borderGlowColor]="item.is_highlight ? 'hsla(48, 40%, 60%, .7)' : undefined"
              [borderColor]="item.is_highlight ? 'hsl(48, 30%, 15%)' : 'var(--color-neutral-900)'"
              [glowColor]="item.is_highlight ? 'hsla(48, 25%, 60%, 0.05)' : undefined"
              [project]="item"
              (previewClick)="navigateToProjects()"
              (detailsClick)="navigateToProjects()"
              ></article>
              
            }
          </app-infinite-scrolling>
      
          <app-infinite-scrolling direction="vertical" [speed]="42" [gap]="-40" [reverse]="true" [fadeCorner]="false" [pauseOnHover]="false"
          class="relative">
            <div class="hidden sm:block lg:hidden absolute inset-0 z-10 backdrop-blur-[2px] bg-neutral-950/50"></div>
            @for (item of projectColumns()[1].column; track item.id) {
              <article class="w-[350px] h-[200px]" 
              #item app-project-card app-glowing-border-item 
              [borderGlowColor]="item.is_highlight ? 'hsla(48, 40%, 60%, .7)' : undefined"
              [borderColor]="item.is_highlight ? 'hsl(48, 30%, 15%)' : 'var(--color-neutral-900)'"
              [glowColor]="item.is_highlight ? 'hsla(48, 25%, 60%, 0.05)' : undefined"
              [project]="item"
              (previewClick)="navigateToProjects()"
              (detailsClick)="navigateToProjects()"
              ></article>
  
            }
          </app-infinite-scrolling>
          <!-- only displays if width > 1024px -->
          @if(documentListener.isLg()){
            <app-infinite-scrolling direction="vertical" [speed]="42" [gap]="-40" [fadeCorner]="false" [pauseOnHover]="false"
            class="relative">
            <div class="hidden sm:block absolute inset-0 z-10 backdrop-blur-[2px] bg-neutral-950/50"></div>
              @for (item of projectColumns()[2].column; track item.id) {
                <article class="w-[350px] h-[200px]" 
                #item app-project-card app-glowing-border-item 
                [borderGlowColor]="item.is_highlight ? 'hsla(48, 40%, 60%, .7)' : undefined"
                [borderColor]="item.is_highlight ? 'hsl(48, 30%, 15%)' : 'var(--color-neutral-900)'"
                [glowColor]="item.is_highlight ? 'hsla(48, 25%, 60%, 0.05)' : undefined"
                [project]="item"
                (previewClick)="navigateToProjects()"
                (detailsClick)="navigateToProjects()"
                ></article>
              }
            </app-infinite-scrolling>
          }
      
        </div>
      </div>
    </div>
  </div>
</div>
