<div class="py-20"
app-glowing-border glowColor="hsla(0, 0%, 25%, 0.1)" borderColor="var(--color-neutral-900)" glowSize="500px">
  <div app-glowing-border-item
  class="grid grid-cols-[1fr_4fr] grid-rows-[300px] rounded-2xl overflow-hidden">
    <div class="flex flex-col md:gap-4 gap-2 justify-center ml-8">
      <h1 class="text-4xl md:text-5xl font-semibold text-nowrap">Meus Projetos</h1>
      <a routerLink="../../projects"
      class="md:text-lg text-neutral-500 flex items-center gap-1 group
      hover:text-neutral-200 transition-colors whitespace-nowrap">
        Confira todos os meus projetos
        <i class="fi fi-rr-angle-small-right flex
        group-hover:ml-1 transition-all"></i>
      </a>

    </div>
    
    <div class="transform-3d relative mr-px
    mask-y-from-80% mask-y-to-100%">
      <div class="absolute top-[-45px] min-w-full w-fit-conent
      h-[500px] grid grid-cols-[repeat(3,365px)] gap-8
      rotate-[1deg] rotate-y-[-20deg] rotate-x-[20deg] rotate-z-[15deg]">
        <app-infinite-scrolling
         direction="vertical" [speed]="80" [gap]="-40" [fadeCorner]="false" [pauseOnHover]="false">
          @for (item of projectColumns()[0].column; track item.id) {
            <article class="w-[365px] h-[200px]" 
            #item app-project-card app-glowing-border-item 
            [borderGlowColor]="item.is_highlight ? 'hsla(48, 40%, 60%, .7)' : undefined"
            [borderColor]="item.is_highlight ? 'hsl(48, 30%, 15%)' : undefined"
            [glowColor]="item.is_highlight ? 'hsla(48, 25%, 60%, 0.05)' : undefined"
            [project]="item"></article>
          }
        </app-infinite-scrolling>
    
        <app-infinite-scrolling direction="vertical" [speed]="80" [gap]="-40" [reverse]="true" [fadeCorner]="false" [pauseOnHover]="false">
          @for (item of projectColumns()[1].column; track item.id) {
            <article class="w-[365px] h-[200px]" 
            #item app-project-card app-glowing-border-item 
            [borderGlowColor]="item.is_highlight ? 'hsla(48, 40%, 60%, .7)' : undefined"
            [borderColor]="item.is_highlight ? 'hsl(48, 30%, 15%)' : undefined"
            [glowColor]="item.is_highlight ? 'hsla(48, 25%, 60%, 0.05)' : undefined"
            [project]="item"></article>
          }
        </app-infinite-scrolling>
        
        <app-infinite-scrolling direction="vertical" [speed]="80" [gap]="-40" [fadeCorner]="false" [pauseOnHover]="false">
          @for (item of projectColumns()[2].column; track item.id) {
            <article class="w-[365px] h-[200px]" 
            #item app-project-card app-glowing-border-item 
            [borderGlowColor]="item.is_highlight ? 'hsla(48, 40%, 60%, .7)' : undefined"
            [borderColor]="item.is_highlight ? 'hsl(48, 30%, 15%)' : undefined"
            [glowColor]="item.is_highlight ? 'hsla(48, 25%, 60%, 0.05)' : undefined"
            [project]="item"></article>
          }
        </app-infinite-scrolling>
    
      </div>
    </div>
  </div>
</div>
